name: Build & Test

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e-tests/playwright/package-lock.json

      - name: Format check
        run: |
          dotnet format VitaTrack.sln --verify-no-changes --no-restore || {
            echo "::error::Repository is not formatted. Run 'dotnet format VitaTrack.sln' and commit the result.";
            exit 1;
          }

      - name: Restore
        run: dotnet restore VitaTrack.sln

      - name: Build
        run: dotnet build VitaTrack.sln --no-restore --configuration Release

      - name: Unit + Architecture tests
        run: dotnet test VitaTrack.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Install Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e-tests/playwright

      - name: E2E tests
        run: ./test-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            e2e-tests/playwright/test-results/
            VitaTrack.Tests/TestResults/
            VitaTrack.ArchitectureTests/TestResults/
          retention-days: 7