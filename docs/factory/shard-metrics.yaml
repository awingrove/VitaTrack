# Shard intervention/rework ledger. See docs/factory/metrics.md.
# One entry per shipped shard. Only `agent: cheap` entries count toward the
# productivity proof (<= $1/1M token models, e.g. GLM-5.3-Flash / Hy3 class).
# Required fields: id, name, agent, human_interventions, guardrail_failures,
# fix_commits, defects_escaped.
# Optional usage fields (recorded when the executing session's numbers are known):
#   agent_model      exact provider/model of the executor, e.g. opencode-go/glm-5.3-flash
#   tokens_input     prompt tokens billed as input
#   tokens_output    completion tokens
#   tokens_reasoning reasoning/thinking tokens (0 when the model does not expose them)
#   tokens_cache_read  prompt-cache read tokens
#   cost_usd         dollar spend reported by opencode for the session (0 = free tier)
# Extract from the executor session: `opencode session list` to find the session id,
# `opencode export <sessionID>` → info.tokens / info.cost (see metrics.md).

shards:
  - id: PD
    name: Prescribed Doses
    agent: frontier
    human_interventions: 0
    guardrail_failures: 0
    fix_commits: 0
    defects_escaped: 0
    notes: >
      Pilot slice, frontier-executed — proves the shape (handler-per-rule, value objects,
      DTO binding), NOT the productivity claim. First cheap-model proof point is the
      Nutrients slice conversion.

  - id: NT
    name: Nutrients & Blends
    agent: cheap
    human_interventions: 0
    guardrail_failures: 1
    fix_commits: 0
    defects_escaped: 0
    agent_model: opencode-go/glm-5.3-flash
    tokens_input: 1864271
    tokens_output: 46633
    tokens_reasoning: 15169
    tokens_cache_read: 16803968
    cost_usd: 0.61
    notes: >
      Slice conversion from MS per docs/plans/2026-09-21-nutrients-slice.md. Four
      commits, one red gate run (FileSizeTests: added cascade test pushed
      SupplementNutrientRepositoryTests past 300 lines; fixed by splitting
      delete/cascade tests into SupplementNutrientRepositoryCascadeTests). No human
      stops.

  - id: RP
    name: Reports (nutrient + cost)
    agent: cheap
    human_interventions: 0
    guardrail_failures: 0
    fix_commits: 0
    defects_escaped: 0
    agent_model: opencode/mimo-v2.6-flash-free
    tokens_input: 113130
    tokens_output: 15011
    tokens_reasoning: 16723
    tokens_cache_read: 3537216
    cost_usd: 0
    notes: >
      Slice conversion from Services/Models into Features/Reporting per
      docs/plans/2026-09-23-reporting-slice.md. Six commits, zero red gate runs (every format/build/test/e2e gate passed first
      try). Two logged mechanical deviations, no human stops: shards.yaml RP paths
      re-pointed incrementally in each file-changing commit (pre-commit runs
      ShardOwnershipTests — NT lesson DL-002 defect a),       and the controller's
      ViewData projections were adapted mid-sequence so step 3 compiles before the
      step-5 view swap kills the round-trip.

  - id: MS
    name: Supplements (CRUD, CSV import)
    agent: cheap
    human_interventions: 0
    guardrail_failures: 1
    fix_commits: 0
    defects_escaped: 0
    agent_model: opencode/mimo-v2.6-flash-free
    tokens_input: 153824
    tokens_output: 25924
    tokens_reasoning: 20532
    tokens_cache_read: 9601664
    cost_usd: 0
    notes: >
      Slice conversion from Data/Services/Models into Features/Supplements per
      docs/plans/2026-09-23-supplements-csv-slice.md (CoR row validation,
      ImportSupplementsHandler, SupplementImportController split, TD-002 closed).
      Six commits, one red gate run (step-5 e2e: PartialView("_ImportReport")
      resolves under the controller's view folder, so the new controller 500'd;
      fixed with the explicit ~/Views/Supplement/_ImportReport.cshtml path —
      lookup mechanics, not behavior). No human stops. Logged mechanical
      deviations: shards.yaml paths re-pointed incrementally in each
      file-changing commit (pre-commit runs ShardOwnershipTests — DL-002
      defect-a lesson), and the using-line update in CsvImportServiceTests
      (step-2 solution-wide namespace move; assertions untouched).
