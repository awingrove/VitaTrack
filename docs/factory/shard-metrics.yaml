# Shard intervention/rework ledger. See docs/factory/metrics.md.
# One entry per shipped shard. Only `agent: cheap` entries count toward the
# productivity proof (<= $1/1M token models, e.g. GLM-5.3-Flash / Hy3 class).
# Required fields: id, name, agent, human_interventions, guardrail_failures,
# fix_commits, defects_escaped.
# Optional usage fields (recorded when the executing session's numbers are known):
#   agent_model      exact provider/model of the executor, e.g. opencode-go/glm-5.3-flash
#   tokens_input     prompt tokens billed as input
#   tokens_output    completion tokens
#   tokens_reasoning reasoning/thinking tokens (0 when the model does not expose them)
#   tokens_cache_read  prompt-cache read tokens
#   cost_usd         dollar spend reported by opencode for the session (0 = free tier)
# Extract from the executor session: `opencode session list` to find the session id,
# `opencode export <sessionID>` → info.tokens / info.cost (see metrics.md).

