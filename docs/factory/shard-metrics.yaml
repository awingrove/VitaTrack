# Shard intervention/rework ledger. See docs/factory/metrics.md.
# One entry per shipped shard. Only `agent: cheap` entries count toward the
# productivity proof (<= $1/1M token models, e.g. GLM-5.3-Flash / Hy3 class).
# Required fields: id, name, agent, human_interventions, guardrail_failures,
# fix_commits, defects_escaped. cost_usd optional.

shards:
  - id: PD
    name: Prescribed Doses
    agent: frontier
    human_interventions: 0
    guardrail_failures: 0
    fix_commits: 0
    defects_escaped: 0
    notes: >
      Pilot slice, frontier-executed — proves the shape (handler-per-rule, value objects,
      DTO binding), NOT the productivity claim. First cheap-model proof point is the
      Nutrients slice conversion.

  - id: NT
    name: Nutrients & Blends
    agent: cheap
    human_interventions: 0
    guardrail_failures: 1
    fix_commits: 0
    defects_escaped: 0
    notes: >
      Slice conversion from MS per docs/plans/2026-09-21-nutrients-slice.md. Four
      commits, one red gate run (FileSizeTests: added cascade test pushed
      SupplementNutrientRepositoryTests past 300 lines; fixed by splitting
      delete/cascade tests into SupplementNutrientRepositoryCascadeTests). No human
      stops.

  - id: RP
    name: Reports (nutrient + cost)
    agent: cheap
    human_interventions: 0
    guardrail_failures: 0
    fix_commits: 0
    defects_escaped: 0
    notes: >
      Slice conversion from MS per docs/plans/2026-09-23-reporting-slice.md. Five
      commits, zero red gate runs (every format/build/test/e2e gate passed first
      try). Two logged mechanical deviations, no human stops: shards.yaml RP paths
      re-pointed incrementally in each file-changing commit (pre-commit runs
      ShardOwnershipTests — NT lesson DL-002 defect a), and the controller's
      ViewData projections were adapted mid-sequence so step 3 compiles before the
      step-5 view swap kills the round-trip.
