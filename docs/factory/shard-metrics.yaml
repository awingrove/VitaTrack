    name: Prescribed Doses
    agent: frontier
    human_interventions: 0
    guardrail_failures: 0
    fix_commits: 0
    defects_escaped: 0
    notes: >
      Pilot slice, frontier-executed — proves the shape (handler-per-rule, value objects,
      DTO binding), NOT the productivity claim. First cheap-model proof point is the
      Nutrients slice conversion.

