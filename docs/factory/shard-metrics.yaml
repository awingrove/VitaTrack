  - id: SC
    name: Service Connections
    agent: cheap
    human_interventions: 16
    guardrail_failures: 3
    fix_commits: 15
    defects_escaped: 0
    agent_model: opencode-go/glm-5.3-flash (Task 1 implementer) then
      opencode/opencode/space-bunny-free (every subagent from Task 1's review onward)
    notes: >
      Slice conversion plus the credential move per
      docs/superpowers/plans/2026-09-26-in-app-service-connection.md
      (8 tasks + 3 fix rounds + a whole-branch review pass). 31 commits on the
      branch: 4 feat, 15 fix, 8 docs, 3 refactor, 1 test.

      **agent_model is a split pair and is recorded that way deliberately.** Task 1's
      implementer ran on `opencode-go/glm-5.3-flash`; the reviewer's GLM quota was then
      exhausted, so from Task 1's review onward every subagent ran on
      `opencode/opencode/space-bunny-free` at the human partner's instruction
      (progress.md, "Model allocation"). Both are in the `cheap` class, so the shard
      counts toward the productivity proof, but the implementation/review pair differs
      and averaging the two would hide that.

      **No token or cost fields.** metrics.md says an execution's usage numbers come
      from the session-level `info` block of an `opencode export`, per executor session.
      That was not captured for any of the eleven subagents on this branch, and the
      alternative — a number estimated after the fact — is the drift metrics.md warns
      about. An absent field is the honest entry (metrics.md: "an empty field is more
      honest than a guess"). This is a gap in how the branch was run, not a measurement.

      **human_interventions = 16 exceeds the <= 1 ratchet, and that is the finding, not
      a rounding error.** Derived by counting the stops that needed someone other than
      the implementer, per metrics.md's own definition ("review findings that forced
      changes" included): 14 per-task review rounds (findings files for tasks 1-8, six of
      them second or third rounds), the whole-branch review, and the human partner's
      model-allocation instruction. The pre-flight scan in progress.md found 3 defects in
      the plan before a line of code was written, and the plan needed its own corrective
      commit (`35f4f47`) after the debt-register id collided structurally three times.
      A recipe that needs sixteen interventions to ship one slice is not autonomous by
      the metric's own words; the ratchet target, not the number, is what a reader should
      act on. The dominant class is the one DL-006 already names: a comment or doc
      sentence asserting something the code had changed. It recurred about a dozen times
      on this branch and was found only by mutating the *claim* and re-running — which is
      why the whole-branch review pass, and this ledger entry, exist.

      **fix_commits = 15** is the count of `fix:` subjects on the branch (31 commits
      total, 4 feat). Read as "rework commits after a done claim", not as 15 red
      regressions: most are review findings applied, and the subject prefix is the only
      machine-derivable signal available.

      **guardrail_failures = 3 is a floor, not a count.** Three are citable from the
      branch record — `35f4f47` (the pre-commit TechnicalDebtRegisterTests red on
      duplicate register ids, which is what made the collision structural), `3b4ab5c`
      (a de-flake of the stamps test), and the stale exported `VitaTrack__ApiKey` that
      reddened the two enrichment e2e specs (later shown, by stashing and re-running on
      clean `716fc69`, to be pre-existing and not this branch's regression — the
      implementer reported it rather than touching the spec). The two enrichment e2e
      reds are therefore NOT counted here. No tooling derives this number
      (metrics.md: "Until tooling derives them, the agent records them"), so it is an
      undercount and is recorded as one rather than guessed upward.

      **defects_escaped = 0 at ledger time, by definition rather than by measurement:**
      the slice has not merged. DL-001..DL-006 all predate or sit outside it.

      The branch added 43 claimed files, which is what pushed the total the
      ShardOwnershipTests floor is derived from from 145 to 199; the floor was ratcheted
      130 -> 183 in the same pass, as its own comment requires.
