defects:
  - id: DL-001
    title: >-
      `Money +` silently kept the left operand's currency
    found: 2026-09-21
    injection_stage: >-
      (found Sep 2026 in branch review; fixed same day, "fix: Money mixed-currency
      addition throws"). value-object design (Phase 6 rollout) — mixed-currency semantics
      left unresolved and papered over with a "caller guarantees same currency" comment.
    detection_stage: >-
      human code review. Unit tests and CI **both passed** the defective
      semantics — the tests were written by the same agent that wrote the defect, so they
      encoded the bug as expected behavior. Evidence for keeping review mandatory.
    systemic_gap: >-
      the value-object recipe had no rule about invalid-combination
      semantics. Closed in `new-shard.md` (value objects fail loudly on invalid
      combinations; test the error edges, not just the happy path).
    closed_in: new-shard.md

  - id: DL-002
    title: >-
      NT briefing contained two design-stage defects, caught by the executing
      cheap-model session
    found: 2026-09-22
    injection_stage: >-
      (found Sep 2026 during the NT slice conversion; no code damage — both resolved by
      logged mechanical deviations). Defect a (step ordering): the briefing put all
      `shards.yaml` surgery in step 5, but the pre-commit hook runs ShardOwnershipTests
      on every commit — file moves in step 2 cannot go green without re-pointing the five
      core paths in the same commit. The agent re-pointed paths in step 2 and left full
      ownership surgery for step 5. Defect b (wrong current-state claim): the briefing
      said `BlendEnrichmentTests` "stays in LLM" but it was claimed by MS; the agent moved
      the claim to LLM, matching intent. briefing authoring (design).
    detection_stage: >-
      cheap-model execution with escalation protocol — the deviations were
      logged, not silent.
    systemic_gap: >-
      briefings stated current-state facts from memory instead of
      checking the manifest, and weren't dry-run against the guardrail gating each step.
      Closed in `design-review.md` (checklist now requires verifying claimed current-state
      facts against `shards.yaml`, and dry-running each step against its gate).
    closed_in: design-review.md

  - id: DL-003
    title: >-
      controller attempted to approve+merge its own PR and deleted the head
      branch mid-CI
    found: 2026-09-24
    injection_stage: >-
      (found Sep 2026 during the post-rollout hygiene slice; PR #19 was
      auto-closed by the branch deletion and recovered from `refs/pull/19/head`).
      merge-step protocol missing from the process contract —
      `FACTORY.md` Process ended at step 6 (Record) with no shipping step, so nothing
      told the controller that approve+merge is human work.
    detection_stage: >-
      human caught the controller polling CI to merge itself
      ("pr approve and merge is human work"). Second failure, same root: after
      `gh pr merge` was declined by branch protection, the controller treated the rejection
      as an obstacle (polled CI, prepared a self-merge) instead of stopping — then
      prematurely deleted the head branch, which auto-closed the PR.
    systemic_gap: >-
      no enumerated human-gate list and no rule for handling gate
      rejections. Closed in `FACTORY.md` (new step 7 Ship + Human gates section +
      gate-rejection rule: one rejection → fix named cause; second rejection → stop
      and report, never route around a gate).
      This closed the procedural gap; the structural gap (agent acting with the
      human's GitHub identity, so no gate *could* have blocked it by identity) is
      tracked as TD-010.
    closed_in: FACTORY.md

  - id: DL-004
    title: >-
      open debt entry TD-006 silently dropped during an out-of-order PR merge
    found: 2026-09-24
    what: >-
      PR #20 (TD-010 inserted after TD-003) merged before PR #19 (TD-006
      moved to the same insertion point). The branch-update merge `7b8283e` resolved the
      same-anchor insert conflict by keeping TD-010 and discarding TD-006 — an open
      entry with a pending paydown vanished from the register while plan line 278 still
      claimed "TD-003 + TD-006 open".
    injection_stage: >-
      (found Sep 2026 when the human questioned the merge order of PRs #19/#20; no
      code damage — register content lost). merge resolution — two PRs inserting at one
      anchor point, no integrity check on the merged register.
    detection_stage: >-
      human suspicion of merge order; audit showed 0 occurrences of
      TD-006 on main.
    systemic_gap: >-
      the register has no machine check (`ShardMetricsLedgerTests`
      guards `shard-metrics.yaml`, nothing guards the register). Closes with the
      self-verifying-docs direction in `VISION.md`: register ids should be resolvable by
      a test (every referenced TD/DL id must exist). Restored in this change.

  - id: DL-005
    title: >-
      the LLM seam logged the provider's raw error body, which quotes the rejected API key back
    found: 2026-09-28
    what: >-
      `LlmClient.PostChatAsync` logged `LogWarning("LLM API error: {StatusCode} - {Content}", statusCode, rawBody)`
      on every non-2xx, so a 401 body of the shape
      `{"error":{"message":"Incorrect API key provided: sk-…"}}` reached the log verbatim.
      Twenty lines below, the catch path passed the exception object to `LogError`, which
      renders an `HttpRequestException`'s message — and that message is where .NET puts
      the `host:port` of the base URL the user typed. Two lines, one file, one rule
      broken twice. The line predated the service-connection slice; what the slice changed
      was the *credential's* home, from a config value to a key the user pasted into a
      form, which is what makes an echoing provider body a routine event rather than a
      remote one. Fixed in the fix round the injection stage names: the body is no longer
      an argument and is no longer read at all on the non-2xx path, and the catch path
      logs `ex.GetType().Name` with no exception attached.
    injection_stage: >-
      (found Sep 2026 in review of commit `46bcf02`; the code itself was pre-existing.)
      Two conflicting instructions in one brief — step 1's "keep existing error behavior"
      (glossed as scoped to the *returned* `LlmCompletion`) and the dispatch's global
      "the credential must never be logged". The brief never mentioned logging, so
      leaving the line was a reasonable reading; the conflict was never surfaced to
      anyone as a conflict.
    detection_stage: >-
      code review. No test could have caught it: the pre-existing tests asserted the
      returned error string, and nothing anywhere asserted what the logger was told.
    systemic_gap: >-
      the rule "a connection must never reach a log line" existed only as the doc
      comment on `ServiceCatalogClient.LogFailure` and as one test in one slice. A rule
      that lives in a code comment does not bind the file above it, and no architecture
      test or manifest key mentioned it, so the LLM seam could add a logging line with
      nothing to object. Closed in the root `AGENTS.md` logging rule (log the failure's
      category, never the payload, never the exception object) and in
      `LlmClientLoggingTests`, which pins the rule for the completion client the way
      `ServiceCatalogClientFailureTests` already pins it for the probe.
    closed_in: LlmClientLoggingTests.cs

  - id: DL-006
    title: >-
      a test comment claimed a guarantee no assertion provided, and the suite stayed green
      with the claim false
    found: 2026-09-28
    what: >-
      The doc comment on `AddCore_LlmClient_CarriesNoBaseAddressAndNoAuthorization` said
      resolving `IHttpClientFactory` for the name `"llm"` "is also what pins that the
      registration itself still exists; drop it and this throws rather than quietly
      returning an unconfigured client". The reviewer deleted
      `services.AddHttpClient("llm");` and ran the whole solution: arch 29 / unit 357 / 0
      failed. `DefaultHttpClientFactory.CreateClient` on an unknown name returns a fresh
      unconfigured client and never throws. Five more comments overstate their reach the
      same way: `LlmClient`'s class doc ("registered with no configure delegate", stronger
      than two value asserts), the seam test's "the state any other caller of that name
      could put it in" when the name has one user, `ConfigBindingAbsentTests`' token
      rationale (three tokens it described as named "in a binding, an appsettings reader
      or a doc sentence", none of which had a location anywhere), its JSON section token
      unanchored so `"name": "VitaTrack"` in `package-lock.json` was a violation, and
      the guard's scope note, which disclosed the root `AGENTS.md` exclusion as an
      inheritance rather than as the decision it is.
    injection_stage: >-
      (found Sep 2026 in review round 1 of the service-connection slice, Task 6.) The
      delete-configuration task rewrote comments to describe the post-deletion state and
      checked each against the *code*; it did not check each against the *assertions
      standing behind it*. The same round recorded a test limitation in its report as
      "cannot be made red by any mutation available to me", which one line of delegate
      falsified.
    detection_stage: >-
      code review, and only because the reviewer mutated the comment's claim — deleted
      the registration — and re-ran the suite. No test could have caught it: a comment
      has no assertions, and a green suite is indistinguishable from a guarantee that
      holds.
    systemic_gap: >-
      a comment stating a guarantee reads as a test, and nothing checks it: mutation runs
      on code, not prose, so the only available method is a human inverting the sentence
      and seeing whether anything goes red. Not closed by this fix — six comments are now
      true and one assertion stands in for the registration, which is a specific repair,
      not a gate. The transferable rule for the next agent: a comment being rewritten is a
      claim under review, and the mutation that checks it is to invert the sentence and
      re-run.
