# Technical debt register. Machine-checked by
# VitaTrack.ArchitectureTests/TechnicalDebtRegisterTests.cs — an entry that loses
# a field, duplicates an id, or points at a moved file is a red build.
# Prose is migrated verbatim from the prose register; this file moves text, it does
# not edit it.
#
# Schema (read this before adding an entry):
#   open     required: id, title, where, what, interest, paydown
#            forbidden: closed, note
#   closed   required: id, title, closed (a real date), note
#            optional:  where, what, interest
#   defects  required: id, title, found (a real date), injection_stage,
#                      detection_stage, systemic_gap
#            optional:  closed_in
#            DL-004 also carries a `what`; nothing is forbidden on a defect.
#
# The open/closed asymmetry is deliberate. An open entry states its interest rate
# because it drives prioritization; a closed entry records what shipped. Do not
# unify the two shapes.
#
# EVERY prose field is a folded block scalar (>-), never a plain scalar: the text
# contains ": " throughout (**Interest:**, Closed 2026-09-25:, **Defect a (step
# ordering):**), which is a parse error in a plain scalar. Indentation is
# significant — a continuation line that loses its two-space indent silently ends
# the scalar and truncates the field. Keys sit at four spaces, content at six.
#
# Prose that is not one of the schema's sub-bullets is folded into the field it
# belongs to, with its own label kept, so that nothing is lost:
#   DL-002  "Defect a (step ordering):" and "Defect b (wrong current-state claim):"
#           are prepended to injection_stage
#   DL-003  "Second failure, same root:" is appended to detection_stage
#   every defect's "(found <month-precision prose>)" parenthetical is folded into
#   injection_stage; `found` carries only the ISO date, never the prose
#
# `closed_in` names the file a defect's systemic_gap says it was "Closed in". A
# defect whose systemic_gap carries no such clause has no `closed_in` (DL-004).

open:
  - id: TD-021
    title: >-
      The repository's "default stamps mean now" contract is defeatable by a `with` clone, and nothing binds a call site to it
    where: >-
      `VitaTrack.Core/Features/ServiceConnections/ServiceConnectionRepository.cs:101-103`,
      `VitaTrack.Core/Features/ServiceConnections/SaveConnectionHandler.cs:36-65`
    what: >-
      `SaveAsync` supplies `CreatedAt`/`UpdatedAt` from its own clock read **only** when
      the caller leaves them `default`. That contract is invisible at the call site and
      silently defeated by `var next = row with { ... }`, which copies every property. The
      tracer's handler did exactly that: a reconnect wrote a row carrying its
      predecessor's `CreatedAt` and `UpdatedAt`, and `GetAllAsync`'s
      `ORDER BY UpdatedAt DESC, Id DESC` fell back to its id tiebreak. The call site is
      fixed and a test now pins it, but the shape itself is still open.
    interest: >-
      the shape is defeatable in one token, `with`, and nothing at a call site makes
      that visible: a comment asserting the stamps stay default is not evidence, because
      the tracer's said exactly that and was wrong. The app *is* on the default-supply
      path today — the handler leaves both stamps `default` so `SaveAsync` supplies
      `now` — and `SaveConnectionHandlerTests.HandleAsync_Reconnect_StampsTheNewRowInsteadOfCloningTheOldStamps`
      fails the moment a clone reappears. The risk is prospective, not a gap that is
      open now: the next call site that clones a persisted record makes the path
      unreachable again, and nothing short of that test failing tells anyone.
      `ServiceConnectionRepositoryTests.SaveAsync_StampsCreatedAtAndUpdatedAt` cannot
      catch it, because it drives the repository directly and so would stay green on a
      repository whose default-supply branch the app no longer reached. TD-019's class,
      one layer up.
    paydown: >-
      either construct the replacement record field by field at every call site that must
      not inherit stamps, or drop the caller-supplies-stamps branch from the repository so
      the only possible stamps are the repository's own. The first is local and cheap;
      the second changes a documented contract and needs the repository tests re-read
      before it lands.

  - id: TD-017
    title: >-
      `Supplements.DailyDose` accepts free text no dosage vocabulary can express
    where: >-
      `VitaTrack.Core/Features/Supplements/Supplement.cs:19`,
      `VitaTrack.Web/Views/Supplement/Create.cshtml` (`input#DailyDose`).
    what: >-
      `DailyDose` is the one remaining free-text dosage field, and it is deliberately
      so — it holds "3 capsules", "1 scoop (5g)", "1 tablet", "2x with meals". Unlike
      `SupplementNutrient.Dosage` it is not a nutrient amount, so no value object can validate
      it. The recognized set is now 8 units, which covers measurement and count-nouns but
      explicitly **not** compound or frequency forms.
    interest: >-
      a user typing the word `tablespoon` (rather than `tbsp`) or any phrase
      like "with meals" is outside the vocabulary by construction, so a future attempt to
      validate this field will either reject legitimate input or pull `DailyDose` into a
      value object it does not belong in. Nothing marks that line.
    paydown: >-
      decide what `DailyDose` *is*. Either (a) leave it free text and record
      here that it is intentionally unvalidated, so the next reader does not "fix" it, or
      (b) split it into a frequency field plus a dose-form vocabulary of its own. (a) is
      cheap and is the recommendation; (b) is a new domain concept needing an ADR.



  - id: TD-019
    title: >-
      `Expand` returns an empty list silently, so a third caller would get silence for free
    where: >-
      `VitaTrack.ArchitectureTests/ShardOwnershipTests.cs:180-207`
    what: >-
      `Expand`'s three branches each return an empty list with no error, and the zero-match
      check lives in the *caller* — so a third caller would get silence for free. Both current
      callers (slice artifacts and the allowlist) now error on `Count == 0`, so this is
      backstopped today.
    interest: >-
      the same "wrong is loud, deleted is silent" class TD-013 was, one layer down. It is
      latent because two callers happen to check; a third would not.
    paydown: >-
      move the zero-match check into `Expand` itself so it cannot be forgotten by a caller.

  - id: TD-020
    title: >-
      `StoryMapConsistencyTests` skips a story that declares no `tests:` key
    where: >-
      `VitaTrack.ArchitectureTests/StoryMapConsistencyTests.cs:88-89`,
      `storymap.yaml`
    what: >-
      a story with no `tests:` key is skipped, so a shipped story can claim zero test
      coverage without a red build. Split from the original TD-019 because the two halves
      have different owners: that one is a guardrail defect, this one is a policy question.
    interest: >-
      the story map is how the factory claims every story is tested. If a story may
      legitimately declare no tests, then "untested" is unrepresentable rather than detected,
      and the map's central claim becomes unfalsifiable — the same shape as TD-014's lost-id
      half, where a rule that cannot fail is read as a rule that is passing.
    paydown: >-
      decide whether a story with no `tests:` key is an error or a legitimate
      documentation-only story, and make the test agree either way. This is a **design
      question, deliberately not decided here**: the repo's story map currently claims every
      story is tested, so "no tests" means a broken claim today — but a documentation-only
      story may be a legitimate category nobody has named yet. Answering it needs a
      developer, not a refactor.

  - id: TD-018
    title: >-
      No test resolves a `TD-`/`DL-` id referenced from prose in other documents
    where: >-
      `VitaTrack.ArchitectureTests/TechnicalDebtRegisterTests.cs`,
      `docs/factory/technical-debt.yaml`
    what: >-
      the register is machine-checked, but nothing verifies that prose *elsewhere* still
      references real ids. `AGENTS.md`, `BIBLIOGRAPHY.md`, `VISION.md`,
      `docs/factory/design-review.md`, `docs/sdlc-practices.md`,
      `docs/adr/0006-vertical-slice-architecture.md` and the briefings under
      `docs/plans/` all name `TD-`/`DL-` ids in prose.
    interest: >-
      a deleted or renumbered id in a plan, a briefing, or `AGENTS.md` reads as a live
      reference, and nothing turns it red. That is the drift class TD-015 documents and
      the self-verifying-docs direction in `VISION.md:26-44`; checking the register alone
      addresses neither.
    paydown: >-
      extend the "enforced by" meta-test to resolve every `TD-\d+`/`DL-\d+` reference in
      `docs/`, root `AGENTS.md`, and `docs/factory/*.md` against the register. Do **not**
      fold this into TD-014's close — it is a distinct change with its own design
      questions: which files are in scope, and what a reference inside a *closed* entry's
      prose or inside a superseded `docs/plans/` briefing is *meant* to mean. Both are
      historical records citing what was true when written, so a naive scan reports each
      as an error and the fix must distinguish a live claim from a dated citation rather
      than suppress the scan.
    deferred: 2026-09-27
    deferral_note: >-
      **Deferred by freeze, not declined.** The 2026-09-27 factory wrap-up (see
      `docs/factory/new-shard.md`, "Guardrail discipline") agreed a commit-mix freeze on
      meta-layer work for the next two branches, because the previous branch was six
      test/doc commits to one product commit. This entry is the same class of work that
      consumed those 22 commits, so it is parked rather than rejected.

      It stays **open** deliberately. Closing it would write a decision that reads as "we
      chose not to detect lost entries," which is worse than a known gap — a closed entry
      looks resolved, and an open one looks like work. Revisit when a branch is
      majority-product-code again, or when a `TD-`/`DL-` id is actually lost in a merge,
      which is the event this exists to catch.

  - id: TD-022
    title: >-
      The connection badge explains itself only in a `title`, so a screen-reader user
      reads "unverified" with nothing behind it
    where: >-
      `VitaTrack.Web/Views/ServiceConnection/_ConnectionBadge.cshtml`
    what: >-
      the badge renders one word (`verified` / `unverified`) in a pill, and the sentence
      explaining what that word means — the unverified one now says the connection is saved
      but unconfirmed and that three causes look the same from here (it said "enrichment can
      still work" until the fix round that corrected it, which is why the wording is
      paraphrased here rather than quoted, so this entry does not go stale the next time the
      copy is touched) — lives in the `title` attribute. A `title`
      is hover-only: it is not reliably announced, and it is unreachable by keyboard and by
      touch. The Settings page does not rescue this, which an earlier version of this entry
      claimed it did: `_Unverified.cshtml` states the same fact in visible words, but it
      renders only on the response that answers a probe which did not verify, and a plain
      page load carries neither a probe nor a note. So the badge is the *only* statement
      there too, and on the enrichment pages — the whole reason the badge exists — it is
      still the only statement, and a screen-reader user gets the bare word.
    interest: >-
      low for a sighted keyboard user, who can hover; it bites exactly the users the
      enrichment-flow badge was added to protect — someone about to spend a request on a
      service nobody confirmed, who cannot see that "unverified" is a state rather than an
      error. The *wording* is now held by the e2e, so it can no longer be dropped or
      softened by accident; the *shape* is held by nothing, and that is the half still open —
      a future edit can move the sentence further out of reach without failing a test.
    paydown: >-
      An owner has to decide between visible text (a sentence under the pill, which is a
      design change and belongs in a `DESIGN.md` amendment) and an announced accessible name
      (an `aria-label` carrying the same sentence, invisible, with `title` kept for hover).
      Whichever is chosen, add the e2e assertion for the *shape* with it: the spec now pins
      the `title`'s text in both directions, so a regression that dropped the explanation
      would be red, but one that kept the words in a `title` and added nothing reachable
      would still pass. That is the assertion this paydown still needs and the one the
      wording pin cannot stand in for. The Settings
      page is not a second copy of the decision and must not be counted as one: the note it
      renders is per-response and the badge is the durable half, so fixing the badge on the
      enrichment pages leaves the Settings page unchanged on purpose.

  - id: TD-023
    title: >-
      `DESIGN.md:241-244` requires a spinner in the submit button; no form in the
      app implements it, and the rapid-click guard does the disable half only
    where: >-
      `VitaTrack.Web/wwwroot/js/service-connection.js`,
      `DESIGN.md`
    what: >-
      the design contract says an htmx form "must disable their submit button while a request
      is in flight and re-enable on response" *and* "show progress with
      `spinner-border spinner-border-sm` injected into the button, never a full-screen
      overlay". The guard does the first two halves: the button is disabled on
      `htmx:beforeRequest` and re-enabled on `htmx:afterRequest`, and both are now pinned
      (`should disable the submit button while the connect is in flight` and
      `should re-enable the submit button when the response is not swapped in`). It adds no
      spinner, and no spec asserts one. The second half is not merely missing on the Settings
      page — it has never been implemented anywhere. The three pre-existing
      `spinner-border` sites (`Views/Supplement/Create.cshtml`,
      `Views/Supplement/Edit.cshtml`, `Views/Supplement/_ImportModal.cshtml`) are
      region-level `text-center` divs outside the button, so the sentence is
      unimplemented app-wide and its "never a full-screen overlay" clause is a
      description of nothing that exists. That is why the sentence is still here rather than
      deleted to match the code: the sentence is the project's only statement of what a
      progress affordance should be, and removing it to make a guard pass would discard a
      decision nobody made.
    interest: >-
      the gap is a missing affordance, not a wrong one — a disabled button does say the
      request is in flight. It matters because the contract is normative and has never
      matched any implementation: as written it tells the next agent to add a spinner to
      forms that already disable, and leaves open whether a greyed button *plus* a spinner
      is the project's intent or two answers to one question. The cost of leaving it
      unsettled is that the contract cannot be cited as true by anything.
    paydown: >-
      A decision between the two branches, taken by whoever picks this up rather than by a
      task that has already shipped: either implement the in-button spinner in
      `service-connection.js` (insert the Bootstrap markup alongside the disable) and pin it
      in the e2e spec in the same change, or amend the sentence to name the region-level
      indicator the app actually uses, in which case the three existing views become the
      reference implementation and the "injected into the button" clause goes. The two are
      not equivalent — one is a progress indicator, the other is a duplicate-submit guard —
      and the contract currently reads as if it wanted both. Whichever branch is taken, an
      assertion has to come with it: no spec asserts a spinner today, so a change in either
      direction would pass the suite unremarked.

  - id: TD-016
    title: >-
      `FileSizeTests` attributes a whole file's lines to every type in it
    where: >-
      `VitaTrack.ArchitectureTests/FileSizeTests.cs:45-63`, `:92-104`.
    what: >-
      the type regex now matches `struct` (fixed 2026-09-25), but the line count is
      the file's total, attributed to each type name found in it. A file declaring a 5-line
      struct beside a 300-line class fails on the *struct* key, with a message naming the
      struct. Order-blind and indifferent to where the type ends.
    interest: >-
      a confusing, hard-to-diagnose failure the day a large file also declares a
      small type; today it is harmless because the largest struct is 53 lines.
    paydown: >-
      compute per-type spans by matching braces rather than counting file lines, or
      at minimum document the attribution at the call site so the next failure is readable.

  - id: TD-010
    title: >-
      Agent and human share one GitHub identity; PR approval not machine-enforced
    where: >-
      repo settings (branch protection / rulesets), local `gh` auth (the
      `awingrove` keyring is inherited by agent sessions), agent harness config
      (`.opencode/`), and the soft rule added in `FACTORY.md` step 7.
    what: >-
      controller sessions authenticate as the human's own account — push,
      PR open, branch delete, and an attempted approve/merge all ran with human
      credentials (DL-003). Nothing in the audit trail distinguishes agent actions from
      human ones, and "the human approves the merge" is only a convention: the account
      that authored the PR can attempt to merge it (branch protection declined the
      attempt, but identity-based prevention — author cannot approve own PR — cannot
      exist while author and approver are the same account).
    interest: >-
      every PR's "human review" is unverifiable; agents hold destructive
      rights over the repo (DL-003: a mid-CI branch deletion auto-closed PR #19);
      `human_interventions` in the ledger cannot distinguish a human click from an agent
      one, so the headline metric slowly becomes unfalsifiable.
    paydown: >-
      (1) dedicated machine account or GitHub App installation for agent
      sessions — token scoped to `contents: write` on feature branches +
      `pull_requests: write`, with **no** merge/approve on protected refs and no
      administration rights; (2) agent sessions run with `GH_CONFIG_DIR` / `GH_TOKEN`
      pointed at those creds, never the human keyring; (3) `main` ruleset: require
      approvals + dismiss stale reviews, so author-is-not-approver becomes enforceable
      once identities differ; optionally CODEOWNERS requiring the human account;
      (4) replay the DL-003 scenario as an acceptance test — agent creds must be
      *rejected* at approve/merge, not merely deferred by convention.

  - id: TD-024
    title: >-
      `ServiceConnections` is deliberately unseeded, and nothing in code marks it
    where: >-
      `VitaTrack.Core/Data/DbInit.cs`, `AGENTS.md`
    what: >-
      Every other table `DbInit.EnsureCreated` creates carries a seed. This one does
      not, because seeding a credential is wrong: a seed row would put an API key in
      a source file that is committed to git. The AGENTS.md seeding rule has exactly
      one documented exception and it is here.
    interest: >-
      A future agent reading "seed data for new entity types" and finding no seed
      block for `ServiceConnections` cannot distinguish a deliberate exception from
      an oversight, and "fixing" it puts an API key in a source file that is
      committed to git. The cost is real per change, not one-off: the missing seed
      also means the app has no connection on a fresh database, so any test that
      assumes one is exercising a path a new user never takes.
    paydown: >-
      None needed. The exception is recorded in AGENTS.md and here; the compensating
      coverage is the e2e spec, which creates its connection through the UI rather
      than reading a seed row.

  - id: TD-025
    title: >-
      Should the app normalise a base URL that already ends in `/v1`? Both answers are
      defensible and the product has deliberately picked neither
    where: >-
      `VitaTrack.Core/Features/ServiceConnections/ServiceEndpoint.cs`
      (`ServiceEndpoint.Resolve`),
      `VitaTrack.Web/Views/ServiceConnection/_ConnectForm.cshtml`
    what: >-
      `ServiceEndpoint.Resolve` appends its own `v1/models` and the connect form says so,
      so a user who pastes the base URL out of a provider's README — which overwhelmingly
      reads `https://host/v1` — gets `https://host/v1/v1/models`, a 404, and a connection
      saved as `unverified`. The completion then posts to `/v1/v1/chat/completions` and
      404s as well, so enrichment writes no nutrient rows at all. The app now *reports*
      the state truthfully: the unverified note and the badge `title` each name three of
      the causes the app cannot tell apart, and the e2e pins both strings. "Three of",
      not "all three": the note names an endpoint with no model list, a base URL the
      service does not serve, and a rejected key, but a refused connection, a timeout and
      a 2xx whose body is not a readable catalog all reach the same state as well
      (`ServiceCatalogClient` answers `ModelCatalog.Unverified` for a non-2xx, for an
      empty or wholly unusable catalog, and from its catch-all), so the honest count is
      **at least** three and the e2e's own cases (a) no model list served, (b) a base URL
      the service does not serve and (c) a refused connection are three of them. It does
      not prevent the case, and whether it should is open. Two branches: never rewrite a
      typed URL and say so in the form's help, or strip a trailing `/v1` before appending.
    interest: >-
      **Both branches are reasonable, which is exactly why this may not be settled in
      passing.** Never rewriting is defensible because the URL is the user's own, and a
      gateway that wants `/v1` inside its own base is misconfigured against
      `ServiceEndpoint`'s contract — rewriting it would paper over a real
      misconfiguration. Stripping is defensible because OpenAI-compatible gateways
      overwhelmingly serve `{root}/v1/...` while the value a user has to hand is the one
      printed in the README, so "never rewrite" makes the most common paste on the
      internet fail quietly. The cost of stripping is that it silently changes the request
      target and would break a real, if rare, service that genuinely lives at
      `{root}/v1/v1/...`. The decision belongs to a human specifically because it changes
      what the app does with a value the user typed; a fix round whose scope was copy and
      gates is the wrong place to answer it, and a behaviour change hidden inside a copy
      fix is the worst available outcome.
    paydown: >-
      take the decision in an ADR — appending a new document under `docs/adr/`, never
      editing an existing one — or as a `DESIGN.md` amendment, and land the e2e for
      whichever branch is chosen in the same change. The discriminating test is a spec
      that types `{stub}/v1` into the connect form and asserts the path the stub
      **recorded**; today nothing pins that, which is why the case can only be handled by
      copy. Do not change `ServiceEndpoint.Resolve` itself without that record: its
      URI-building is already unit-pinned, and a rewrite there would break those pins
      while the design question it answers is still open.

  - id: TD-028
    title: >-
      A superseded API key stays in `ServiceConnections` forever, and the product has
      deliberately picked neither "keep it" nor "erase it"
    where: >-
      `VitaTrack.Core/Features/ServiceConnections/SaveConnectionHandler.cs:46-48` (`Id = 0`,
      the always-insert),
      `VitaTrack.Web/Controllers/ServiceConnectionController.cs:38-45` (`Delete`, the
      active-only delete)
    what: >-
      Every connect writes a **new** row — `SaveConnectionHandler` sets `Id = 0` and
      `ServiceConnectionRepository.InsertAsync` demotes the previous active row in the same
      transaction rather than reusing it — and `Delete` removes **only** the active row.
      Measured on a real SQLite database through the real handler and repository: three
      connects followed by Disconnect leave rows `(1, 'sk-KEY-1-1111', IsActive 0)` and
      `(2, 'sk-KEY-2-1111', IsActive 0)` behind a page that now reads "not connected".
      The keys are stored as typed, in plaintext, exactly as the live one is.

      Two facts that are easy to get backwards, both measured rather than assumed.
      `IServiceConnectionRepository.DeleteAsync(int id)` is a general per-id delete and
      **does** remove a superseded row (it returned `true` on row 1 in the same probe), so
      the gap is not a missing capability — it is that no UI, and no production caller of
      any kind, ever names a superseded id. And `GetAllAsync` is the only method that
      could enumerate the residue, and it has **zero production callers**: the residue is
      invisible to the app, not merely unrendered. Retention itself is not an oversight —
      `storymap.yaml` carries "Reconnect by saving again, keeping the previous connection
      on record" as a `done` story.

      What was missing until this entry is that the thing being retained is a
      **credential**, and that the Disconnect confirm read "only the connection is
      removed", which is false. That sentence has been corrected to state the retention
      and is pinned by the e2e; this entry is about the decision, not the copy.
    interest: >-
      **Both branches are reasonable, which is why this may not be settled in passing.**
      Erasing superseded keys is defensible because what is retained is not an audit record
      but a live secret: a key the user rotated away from, or revoked at the provider, sits
      in a SQLite file in plaintext with no UI, no expiry and no way to tell it is dead —
      and a local-database app whose whole credential story is "paste a key" makes the
      residue a liability the user was never shown. Retaining them is defensible because
      it is the only record of what the app was configured against: `SaveConnectionHandler`
      reuses the active row to carry forward `Variant`, `MaxTokens` and `Temperature`, a
      reconnect after a bad paste should be recoverable, and an audit trail of which
      endpoint a request went to is exactly what a settings page ought to keep.

      The cost of each is symmetric and neither is free. Erasing loses the history and
      breaks any future "what did I have set up last week" or "which base URL failed"
      debugging, and it must happen at the write choke (`SaveConnectionHandler`, where the
      demotion already is) or the retention will reappear through another insert path.
      Retaining means the credential footprint grows with every save, unbounded and
      invisible, while the page reports "not connected". The decision belongs to a human
      specifically because it is a product promise about stored secrets rather than a
      refactor; this pass corrected the copy that misstated it, and a behaviour change
      hidden inside a copy fix would be the worst available outcome. The same shape as
      TD-025, and deliberately the same treatment: registered, not decided.
    paydown: >-
      take the decision the way TD-025's is taken — an ADR under `docs/adr/` or a
      `DESIGN.md` amendment, never an edit to an existing one — and land **the e2e for
      whichever branch is chosen in the same change**, because none exists today. The two
      branches need opposite tests, and picking the wrong one silently pins the other:
      *Erase*: a spec that connects twice, disconnects, and asserts `GetAllAsync` comes
      back empty (or, if a history UI is added, that the retained rows carry no `ApiKey`),
      so residue cannot come back unnoticed. *Retain*: a spec that connects twice,
      disconnects, and asserts the superseded row is still there **and** that the Settings
      page says so in words — otherwise the retention is exactly as invisible as it is
      today, and the corrected confirm is the only thing standing between the user and a
      false reading. Either way, `SaveConnectionHandler`'s `Id = 0` and the comment above
      it are the place the decision lands, and `ServiceConnectionRepository.cs:111` /
      `SaveConnectionHandler.cs:62` justify the current design *by appeal to
      `GetAllAsync`'s recency order* — a justification that is only reachable from the
      retained-rows branch and becomes moot under the other. Re-read both comments when
      the decision is taken; neither may be left asserting a shape the code no longer has.

  - id: TD-026
    title: >-
      The 755-line `service-connection.spec.js` has no size guardrail, because
      `FileSizeTests` enumerates `*.cs` only
    where: >-
      `VitaTrack.ArchitectureTests/FileSizeTests.cs:76-89` (`EnumerateCsFiles`),
      `e2e-tests/playwright/tests/service-connection.spec.js`
    what: >-
      both rules in `FileSizeTests` walk `Directory.EnumerateFiles(root, "*.cs", ...)`,
      so the 300-line split trigger in the root `AGENTS.md` reaches no JavaScript at all
      and the e2e suite has no size rule of any kind. This spec is the file most likely
      to grow without anyone noticing, for three reasons that compound: it is 755 lines,
      it is `describe.serial` on a single shared database row, and its section markers
      keep it legible well past the point where a reviewer would think to look.
    interest: >-
      the split trigger exists to stop a unit from mushrooming, and an e2e spec is the
      same kind of unit — a serial file on one shared row carries an ordering dependency
      that both a 1,500-line blob and a second file make hard to see, and neither fails
      anything. Nothing goes red when the next 250 lines arrive; the only signal is a
      reviewer scrolling, and this file's own comments make it look deliberately
      organised enough to skip. Recorded as a guardrail gap rather than a mess, which is
      what it is.
    paydown: >-
      decide whether e2e specs are in scope for a size rule at all, and if so add the
      rule as a JS analogue under `VitaTrack.ArchitectureTests` rather than as a script
      nobody runs. A per-file cap is close to gameable here for the reason TD-016 records
      on the C# side: splitting one serial `describe` across two files would satisfy a
      per-file cap while making the ordering dependency worse, so the unit has to be the
      `describe` and not the file. "What is the unit here" is a design decision, so it is
      not taken by the round that noticed the gap.

  - id: TD-027
    title: >-
      `storymap.yaml` lists the real-provider e2e as `status: done` while it self-skips in
      CI, so `done` currently means "referenced" rather than "executed"
    where: >-
      `storymap.yaml:359-369` (task `LLM-1`),
      `VitaTrack.ArchitectureTests/StoryMapConsistencyTests.cs`
    what: >-
      `LLM-1`'s first story carries `e2e: supplement-llm-integration::should extract
      nutrients from a real product URL using LLM` beside `status: done`. That spec
      self-skips unless `LLM_API_KEY`, `LLM_BASE_URL` and `LLM_MODEL` are all set, and CI
      sources all three from secrets that are unset by default, so in a default CI run
      the spec is skipped and the story still reads `done`.
      `StoryMapConsistencyTests` checks only that the reference *resolves* to a real
      test, so the status is never compared against what the suite actually ran.
    interest: >-
      `done` is the story map's central word — it is how a reader, and the dashboard, tell
      shipped-and-tested from planned — and a status that can read `done` while the only
      test that covers it never executed is the same shape as TD-020's "a story with no
      `tests:` key means anything" and TD-014's lost-id half: a claim that cannot fail
      reads as a claim that is passing. **It is not a false claim about the product.**
      The enrichment path works and is covered by a unit test plus the stub-backed e2e
      that runs on every single run; what a default run does not exercise is the one
      assertion set that needs a real credential, which is the part that cannot be run
      without one. Recorded so the word is read for what it currently is.
    paydown: >-
      a human decides what `done` is allowed to mean, because all three available answers
      are a policy change rather than a test: allow a status that says "conditionally
      verified", split `LLM-1` so the real-provider e2e hangs off a story whose status
      reflects the credential, or keep `done` meaning "referenced" and say so in the
      story-map header. **Deliberately unchanged** — the convention is the human's, and
      re-labelling the entry would hide the gap instead of closing it. Whichever branch is
      taken, the header has to state what the word means, because today nothing does.

closed:
  - id: TD-012
    title: >-
      No architecture test asserts a non-empty selection
    where: >-
      `VitaTrack.ArchitectureTests/CrossSliceSqlTests.cs`,
      `ShardOwnershipTests.cs`.
    what: >-
      a NetArchTest or file-scan rule whose selection is empty passes without
      testing anything. That is precisely how `ServicesLayeringTests` sat green over an empty
      namespace for two slice conversions (TD-006). `ServicesLayeringTests` and
      `WebLayerDependencyTests` now both carry a named sentinel; these two do not.
      `CrossSliceSqlTests` goes vacuous if every `core:` list empties — `SHELL` is already
      `core: []` (`shards.yaml:216`).
    interest: >-
      the same defect class recurs silently, and the next occurrence will be as
      invisible as the last.
    paydown: >-
      add a named-sentinel assertion to each, and extract the duplicated
      `SelectedTypeNames`/`FormatFailures` helpers now that four test classes carry them.
    closed: 2026-09-26
    note: >-
      Closed as **derived invariants, not named sentinels**. `CrossSliceSqlTests` gained
      `Sql_Slices_Claiming_Tables_Also_Claim_Core_Files` — every slice declaring `tables:`
      must claim `core:` files, which needs no slice name to rot. `ShardOwnershipTests` gained
      `Shards_Claim_A_Non_Trivial_File_Set` — a total claimed-file floor of 130 (real total
      145, so 130 = 145 minus 15, the two smallest slices) plus a per-slice clause, because a
      floor alone is gameable by one large slice absorbing another's loss.

      Both were proven load-bearing by mutating `shards.yaml` and observing red, then
      reverting. The floor is deliberately not rounder: 120 leaves 5 of 7 slices collapsible
      and 140 leaves 4 to 5 files of slack, so an ordinary 6-file deletion would turn CI red
      and the constant would get re-tuned until it meant nothing.

      **Accepted limitation:** a slice whose keys are *all* `[]` and whose files are gone
      declares nothing, so both sentinels are vacuous and only the floor sees it, and only for
      drops of 15 or more. Collapsing MF (11) or SHELL (5) alone remains silent. Closing that
      needs either a runtime-derived floor or an "every slice claims at least 1 artifact"
      rule, both design changes this entry did not take on.

      The `SelectedTypeNames`/`FormatFailures` helper extraction named in the original paydown
      did **not** happen; the helpers are still duplicated across test classes. It is cosmetic
      next to the sentinel work and is not tracked separately.

  - id: TD-013
    title: >-
      `CrossSliceSqlTests` silently drops wildcard `core:` patterns
    where: >-
      `VitaTrack.ArchitectureTests/CrossSliceSqlTests.cs:145` (`LoadCore`).
    what: >-
      a `core:` entry containing `*` is discarded without error, unlike a missing
      `tables` key, which is an explicit error (`:124-127`). A future
      `core: VitaTrack.Core/Features/X/**` would quietly disable the ADR-0006 cross-slice
      invariant for that slice with no test failure anywhere.
    interest: >-
      the invariant that is supposed to be machine-enforced becomes
      convention-only, invisibly.
    paydown: >-
      error on a wildcard `core:` pattern, or expand it, matching what
      `ShardOwnershipTests` glob-expansion already does.
    closed: 2026-09-26
    note: >-
      Closed by **erroring, not expanding** — the decision is recorded here because the
      register offered both: error is a strict subset of expand-later, and expanding
      `VitaTrack.Core/**` would pull every slice's SQL into one slice's `tables` and flood the
      rule with false positives, training people to ignore it.

      Widening the sweep, `CrossSliceSqlTests` and `ShardOwnershipTests` now error on every
      silent manifest skip found: the missing `core:` key, a `core:` path resolving to no
      file, a wildcard pattern, a missing artifact key, an allowlist pattern matching zero
      files, and a missing `storymap.yaml` (which had been silently disabling both directions
      of the slice-id cross-check). Absent-key is distinguished from present-but-empty by
      YamlDotNet key presence, not list count, so `SHELL`'s legitimate `core: []` still passes.

      Each error path was proven by mutating the real manifest, observing red, and reverting.
      **No current declaration turned out to be wrong**, so nothing in the manifest was edited
      to make a newly-fatal check pass.

  - id: TD-015
    title: >-
      Stale `VitaTrack.Core/Services` references are back in the live docs
    where: >-
      `VitaTrack.Core/AGENTS.md:8`, `:12`, `:70`; root `AGENTS.md:17`;
      `docs/ArchitectureReview.md:27`.
    what: >-
      TD-007 was closed 2026-09-23 for exactly this class — docs claiming a retired
      layout — and four of the same lines still say interfaces live in
      `VitaTrack.Core.Data` or `VitaTrack.Core.Services`. The directory does not exist;
      `VitaTrack.Core/AGENTS.md:8` contradicts itself three lines apart.
    interest: >-
      an agent reading these reinvents a layout that was deliberately retired,
      and "docs must not lie" (ArchitectureReview §2.2) stops being reviewable because the
      review already passed once on the same text.
    paydown: >-
      delete the four references, and add a grep-based arch test for retired
      namespace names so the fix cannot regress. Fold into the TD-014 register/meta-test work.
    closed: 2026-09-26
    note: >-
      Closed. The four references were rewritten into explicit *prohibitions* (the namespace
      "is retired — do not add to them") rather than deleted, because a bare deletion leaves
      no reason and invites reintroduction. `VitaTrack.ArchitectureTests/RetiredNamespaceTests`
      now scans 230 live files and tolerates exactly the four spans that say so, matched on
      file plus anchored text fragment — any *other* mention in the same file is still a
      violation, so there is no whole-file amnesty.

      Two sentinels keep the rule from being narrowed to nothing: a 200-file scan floor, and a
      cap of 4 permitted mentions that trips with "each addition is a live file that names the
      retired namespace, and needs a human to read it."

      **Accepted limitation:** the cap is a count, not a liveness check. A permitted fragment
      edited out of existence leaves a dead entry that still satisfies the cap — fail-safe, but
      the stale entry is invisible.

  - id: TD-014
    title: >-
      The technical-debt register has no machine check
    where: >-
      `docs/factory/technical-debt.yaml`,
      `VitaTrack.ArchitectureTests/TechnicalDebtRegisterTests.cs`.
    what: >-
      DL-004 recorded an open entry (TD-006) silently vanishing in an out-of-order
      merge. `ShardMetricsLedgerTests` guards `shard-metrics.yaml`; nothing guards the register.
      A referenced-but-missing `TD-`/`DL-` id, a malformed entry, or a duplicate id all pass.
    interest: >-
      the register is the input to prioritization and to the dashboard, so a lost
      entry is a lost piece of work with no trace.
    paydown: >-
      a `TechnicalDebtRegisterTests` in `VitaTrack.ArchitectureTests` resolving
      every `TD-\d+`/`DL-\d+` reference across docs and the ledger, and failing on a duplicate
      or malformed entry. This closes DL-004's systemic half.
    closed: 2026-09-26
    note: >-
      Closed as **partially delivered, deliberately**. What shipped: the register is now
      structured `docs/factory/technical-debt.yaml` (the prose `.md` is deleted, not
      regenerated — a generated view would be a second artifact that can drift from its
      source, which is the failure class this change exists to remove); a five-rule
      `TechnicalDebtRegisterTests` (id uniqueness and format, no id in both `open` and
      `closed`, required fields, forbidden field on the wrong side, and `where` path
      resolution for `open` entries), with an in-memory negative-path test as its proof; and
      the dashboard generator reads the YAML (`scripts/generate-factory-dashboard.py`, −57
      lines). **What that closes, precisely:** the *anchor* half of DL-004's systemic gap —
      two PRs inserting at the same point in a prose register collided during merge resolution,
      and a YAML sequence is position-independent, so that class of conflict cannot recur. The
      *integrity* half is **not** closed and must not be read as closed: rule 1 catches a
      **duplicated** id, and only that. A **vanished** entry is undetectable here, because
      detecting it requires an inbound reference to dangle, and no rule resolves references
      from other documents. Verified: deleting the whole `TD-016` entry leaves 22 entries, all
      five rules green, and `TD-016` referenced only from `docs/plans/` and this register. So
      the honest claim is *a duplicate or malformed id is a red build*; *a lost one is not*.

      The **id-resolution half of the original paydown did not ship** and is TD-018, not
      this entry. A `TD-`/`DL-` id referenced from prose in *other* documents is still
      unverified.

      **Accepted limitations, so no later reader mistakes them for oversights.** (1) Four of
      the five rules have never been observed red on real register data — rules 1–4 pass
      because the data is clean, so they are proven only by the in-memory negative test.
      Rule 5 is the one with demonstrated value, and it earned its keep on its first run by
      finding TD-005's `where` still naming `VitaTrack.Core/Data/FamilyRepository.cs` after
      the MF slice conversion moved it. (2) `where` is validated only for path-shaped
      backtick spans on `open` entries, so a prose `where` can still drift. (3) A closed
      entry's `where` is never checked for existence, because it names a historical path by
      design. (4) `found`/`closed` dates are narrowed to the day a commit named in the
      entry's own prose recorded it, so the source's coarser "found Sep 2026" survives only
      inside the prose fields. (5) **A silently truncated prose field is undetectable.** The
      failure was measured rather than assumed, and the first hypothesis was wrong. An *indent*
      error is already loud without help — a 5-space continuation is a `ParserError` and a
      4-space cut is a `ScannerError` — so it needs no rule. The silent case is a *dropped*
      continuation line, which leaves valid YAML with a shorter field and no structural signal.
      Two content thresholds were measured and both fail: a flat 40-character per-field floor
      false-positives on 7 legitimate fields (the shortest is `` `FamilyRepository.cs:17` ``
      at 24), and a 200-character per-entry volume floor catches **zero** real truncations,
      because all 23 entries absorb a one-line drop. Tightening that floor to 217 would catch
      the tightest entry but leaves only 44 characters of margin, so the first legitimately
      terse entry breaks the build. Truncation is therefore undetectable by any threshold that
      does not also fail on healthy data. The mitigations are review at the point of edit — the
      header comment documents the six-space grid — plus rule 6, which checks the file's shape
      and reports a bad indent as an indent problem rather than an opaque parser message.

  - id: TD-003
    title: >-
      `DosageParser` should be a `Dosage` value object
    where: >-
      was `VitaTrack.Core/DosageParser.cs` (57 lines, deleted).
    what: >-
      parsing of free-text `"500 mg"` lived in static helpers; callers recombined
      amount + unit by hand.
    interest: >-
      amount/unit logic duplicated at every call site; unit typos passed
      silently.
    closed: 2026-09-25
    note: >-
      the entry was **half stale on arrival** — `Dosage` and `Unit`
      shipped in `0bfbb92`/`0053d5e`, and `SupplementNutrient.ParsedDosage` was already the
      report's read path, so only the "static helpers" half was real. `DosageParser.cs` and
      `DosageParserTests.cs` are deleted; parsing now lives on the value objects
      (`Unit.Parse` / `Dosage.Parse` / `Dosage.TryParse`), and `Dosage.Normalize` is the single
      write-choke canonicalizer. `Unit.Canonicalize` returns `null` for anything outside the
      eight recognized symbols (`mg`, `µg`, `g`, `ml`, `tsp`, `tbsp`, `tab`, `IU`), so free
      text can no longer become a report unit — the live defect being paid was `Unit.Parse`
      admitting any token at all, so a user typing "3 capsules" saw "3 capsules" as the unit
      column in the Nutrient Report. Two culture bugs fixed with it: `ToString` and
      `TryParseAmount` are now invariant, because under `de-DE` a stored `"1.5"` parsed as
      **15** (`.` is that locale's group separator) rather than failing.

  - id: TD-006
    title: >-
      `ServicesLayeringTests` only scans `VitaTrack.Core.Services`
    where: >-
      `VitaTrack.ArchitectureTests/ServicesLayeringTests.cs`.
    what: >-
      the rule scanned `VitaTrack.Core.Services` only, and after the LLM conversion
      that namespace no longer existed — so the rule selected **zero** types and passed
      vacuously. No slice service had any layering guard.
    interest: >-
      the guardrail predates slices; every slice conversion shrank its coverage,
      and the last two did so silently.
    closed: 2026-09-25
    note: >-
      retargeted to `VitaTrack.Core` minus `Data`, minus `Primitives`,
      minus `*Repository`-named types and the `ServiceCollectionExtensions` composition root —
      60 types now under the net where there were 0. The carve-out is by name suffix because
      that is the line `RepositoryNamingTests` already draws; `Primitives` stays **inside** the
      net, since a value object must never touch the database. The entry's actual root cause
      is fixed too: a non-vacuity sentinel asserts the selection contains a known type, and
      `Fakes/SneakyDapperService` is the repo's **first negative-path guardrail test** — a
      ban that has never been observed red is indistinguishable from one that cannot go red.
      `WebLayerDependencyTests` got the same sentinel. Verified live: injecting a Dapper
      dependency into a real slice service turns the rule red and names the type.

  - id: TD-011
    title: >-
      `SupplementNutrient.Dosage` should become a `Dosage` value object
    where: >-
      `VitaTrack.Core/Features/Nutrients/SupplementNutrient.cs:21`.
    what: >-
      the entry's stated paydown was to retype `Dosage` from `string` to the `Dosage`
      value object.
    interest: >-
      (as originally written) amount/unit logic recomposed by hand at call sites.
    closed: 2026-09-25
    note: >-
      — superseded, not delivered. The paydown was **declined by
      decision**, and the register says so rather than quietly dropping it. Three reasons,
      each verified before deciding: `SupplementNutrient` *is* the form model on the CRUD
      surface (`@model SupplementNutrient` in Create/Edit), so a `readonly record struct`
      property has no binder and would need a `TypeConverter`; the entity is passed to Dapper
      **as the parameter object**, so a VO property cannot bind from a `TEXT` column without a
      row DTO or type handler; and `Index.cshtml` renders the property directly, so the change
      would also reformat what users see (`500mg` → `500 mg`) and move ~12 e2e selectors. The
      shipped raw-string + `ParsedDosage` pair is the right shape — the missing piece was
      **enforcement**, not the type. `Dosage.IsWellFormed` now guards all four write paths, at
      the two places that already validate: `SupplementNutrient.IValidatableObject.Validate`
      (CRUD, including a blend child, which previously validated nothing) and
      `SupplementNutrientService.PersistHierarchyAsync` (LLM + Review, via the existing
      `NutrientFailure` channel). **Two accepted limitations:** compound units (`50 mg/kg`,
      `20%DV`) are rejected because `Unit` models a single unit, and a bare number is *not*
      reinterpreted as tablets, so `Dosage.Parse("1")` has no unit.

  - id: TD-002
    title: >-
