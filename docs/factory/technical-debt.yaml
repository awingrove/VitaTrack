defects:
  - id: DL-001
    title: >-
      `Money +` silently kept the left operand's currency
    found: 2026-09-21
    injection_stage: >-
      (found Sep 2026 in branch review; fixed same day, "fix: Money mixed-currency
      addition throws"). value-object design (Phase 6 rollout) — mixed-currency semantics
      left unresolved and papered over with a "caller guarantees same currency" comment.
    detection_stage: >-
      human code review. Unit tests and CI **both passed** the defective
      semantics — the tests were written by the same agent that wrote the defect, so they
      encoded the bug as expected behavior. Evidence for keeping review mandatory.
    systemic_gap: >-
      the value-object recipe had no rule about invalid-combination
      semantics. Closed in `new-shard.md` (value objects fail loudly on invalid
      combinations; test the error edges, not just the happy path).
    closed_in: new-shard.md

  - id: DL-002
    title: >-
      NT briefing contained two design-stage defects, caught by the executing
      cheap-model session
    found: 2026-09-22
    injection_stage: >-
      (found Sep 2026 during the NT slice conversion; no code damage — both resolved by
      logged mechanical deviations). Defect a (step ordering): the briefing put all
      `shards.yaml` surgery in step 5, but the pre-commit hook runs ShardOwnershipTests
      on every commit — file moves in step 2 cannot go green without re-pointing the five
      core paths in the same commit. The agent re-pointed paths in step 2 and left full
      ownership surgery for step 5. Defect b (wrong current-state claim): the briefing
      said `BlendEnrichmentTests` "stays in LLM" but it was claimed by MS; the agent moved
      the claim to LLM, matching intent. briefing authoring (design).
    detection_stage: >-
      cheap-model execution with escalation protocol — the deviations were
      logged, not silent.
    systemic_gap: >-
      briefings stated current-state facts from memory instead of
      checking the manifest, and weren't dry-run against the guardrail gating each step.
      Closed in `design-review.md` (checklist now requires verifying claimed current-state
      facts against `shards.yaml`, and dry-running each step against its gate).
    closed_in: design-review.md

  - id: DL-003
    title: >-
      controller attempted to approve+merge its own PR and deleted the head
      branch mid-CI
    found: 2026-09-24
    injection_stage: >-
      (found Sep 2026 during the post-rollout hygiene slice; PR #19 was
      auto-closed by the branch deletion and recovered from `refs/pull/19/head`).
      merge-step protocol missing from the process contract —
      `FACTORY.md` Process ended at step 6 (Record) with no shipping step, so nothing
      told the controller that approve+merge is human work.
    detection_stage: >-
      human caught the controller polling CI to merge itself
      ("pr approve and merge is human work"). Second failure, same root: after
      `gh pr merge` was declined by branch protection, the controller treated the rejection
      as an obstacle (polled CI, prepared a self-merge) instead of stopping — then
      prematurely deleted the head branch, which auto-closed the PR.
    systemic_gap: >-
      no enumerated human-gate list and no rule for handling gate
      rejections. Closed in `FACTORY.md` (new step 7 Ship + Human gates section +
      gate-rejection rule: one rejection → fix named cause; second rejection → stop
      and report, never route around a gate).
      This closed the procedural gap; the structural gap (agent acting with the
      human's GitHub identity, so no gate *could* have blocked it by identity) is
      tracked as TD-010.
    closed_in: FACTORY.md

