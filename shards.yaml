# VitaTrack feature shard manifest
#
# Maps each feature slice to the files that implement it. Drives
# VitaTrack.ArchitectureTests.ShardOwnershipTests: no orphan feature files,
# every path resolves, no double-claim, and story-map id integrity (each
# slice id is a prefix of at least one story-map task id, and vice versa),
# and VitaTrack.ArchitectureTests.CrossSliceSqlTests: every SQL table
# reference in a slice's core files must appear in that slice's `tables`
# declaration (the ADR-0006 cross-slice invariant, machine-checked).
#
# Paths are repo-relative with forward slashes. `**` means "all files under
# this directory, recursively". Cross-cutting files that belong to no single
# slice are listed once in the `allowlist` at the bottom, not here.
#
# `tables` is required on every slice (declare `[]` when the slice issues no
# SQL): the tables this slice's SQL may reference. Own table first; cross-slice
# read dependencies (e.g. display joins) must be declared too — adding one is a
# visible manifest diff for design review. Writes must stay on the own table
# via the owning slice's repository (AGENTS.md FK section).
#
# `models` holds the slice's files under `VitaTrack.Web/Models` — the bind
# models and view models that carry a slice's data into its views. They are
# per-slice (one `SavedConnection` projection is not another slice's business),
# so they are claimed rather than allowlisted. Every slice declares the key,
# `[]` included: a key that is absent was never reviewed.

slices:
