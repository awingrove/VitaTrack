# VitaTrack Story Map
# Generated from PROJECT_PLAN.md and existing views

meta:
  project: VitaTrack
  description: Vitamin and Supplement Tracking Application
  last_updated: 2026-07-28

activities:
  - name: Manage Family Members
    tasks:
      - name: View family members
        stories:
          - title: See all family members in a list
            status: done
            priority: high
            tests:
              - unit: 3
              - e2e: home navigation
      - name: Add a family member
        stories:
          - title: Fill out name and display name
            status: done
            priority: high
      - name: Edit a family member
        stories:
          - title: Update name or display name
            status: done
            priority: high
      - name: Delete a family member
        stories:
          - title: Remove a family member with confirmation
            status: done
            priority: medium

  - name: Manage Supplements
    tasks:
      - name: View supplements
        stories:
          - title: See all supplements in a table with cost
            status: done
            priority: high
            tests:
              - e2e: supplement-nutrient display
      - name: Add a supplement
        stories:
          - title: Enter basic supplement info
            status: done
            priority: high
          - title: Provide manufacturer URL for LLM enrichment
            status: done
            priority: medium
          - title: Skip URL and manually enter nutrients
            status: done
            priority: medium
            tests:
              - e2e: LLM UI flow (review page, manual add/remove)
      - name: Edit a supplement
        stories:
          - title: Update supplement details and re-enrich via LLM
            status: done
            priority: high
      - name: Delete a supplement
        stories:
          - title: Remove a supplement with confirmation dialog
            status: done
            priority: high
            tests:
              - unit: SupplementControllerTests.Delete_CallsRepoAndRedirectsToIndex
              - e2e: supplement-crud delete
          - title: Delete multiple supplements via checkboxes and Delete Selected button
            status: done
            priority: high
            tests:
              - unit: SupplementControllerTests.DeleteSelected_DeletesCheckedSupplementsAndRedirects
              - unit: SupplementRepositoryTests.DeleteMultiple_RemovesSupplementsWithNutrients
              - e2e: supplement-crud bulk delete
      - name: Manage supplement nutrients
        stories:
          - title: View nutrients for a supplement
            status: done
            priority: high
            tests:
              - e2e: supplement-nutrient display
          - title: Add a nutrient manually
            status: done
            priority: high
            tests:
              - e2e: supplement-nutrient add
          - title: Edit an existing nutrient
            status: done
            priority: high
            tests:
              - e2e: supplement-nutrient edit
          - title: Delete a nutrient
            status: done
            priority: high
            tests:
              - e2e: supplement-nutrient delete
          - title: View multiple supplements with their own nutrients
            status: done
            priority: medium
            tests:
              - e2e: supplement-nutrient multi-supplement

  - name: Track Prescribed Doses
    tasks:
      - name: View prescribed doses
        stories:
          - title: See all prescribed doses in a list
            status: done
            priority: high
            tests:
              - e2e: prescribed-dose index
      - name: Add a prescribed dose
        stories:
          - title: Select family member and supplement, set dosage and frequency
            status: done
            priority: high
            tests:
              - e2e: prescribed-dose create
      - name: Edit a prescribed dose
        stories:
          - title: Update dosage, frequency, or instructions
            status: done
            priority: high
            tests:
              - e2e: prescribed-dose edit
      - name: Delete a prescribed dose
        stories:
          - title: Remove a prescribed dose
            status: done
            priority: high
            tests:
              - e2e: prescribed-dose delete

  - name: View Reports
    tasks:
      - name: Daily Nutrient Report
        stories:
          - title: See per-family-member nutrient breakdown
            status: done
            priority: high
            tests:
              - e2e: nutrient-report page load
          - title: View nutrient totals across all members
            status: done
            priority: medium
            tests:
              - e2e: nutrient-report supplements table
          - title: See monthly cost estimate
            status: done
            priority: medium
          - title: Handle empty state when no doses are prescribed
            status: done
            priority: low
            tests:
              - e2e: nutrient-report no-data message
      - name: Cost Report
        stories:
          - title: See cost breakdown by supplement
            status: done
            priority: high
            tests:
              - e2e: cost-report supplement costs
          - title: See cost breakdown by family member
            status: done
            priority: high
            tests:
              - e2e: cost-report member costs
          - title: View grand total cost
            status: done
            priority: medium
            tests:
              - e2e: cost-report grand total

  - name: LLM Enrichment
    tasks:
      - name: Auto-extract nutrients from URL
        stories:
          - title: Scrape manufacturer URL and extract nutrients via OpenRouter
            status: done
            priority: medium
            tests:
              - unit: 5 (mocked HTTP)
              - e2e: 1 (real API, skips without key)
          - title: Review extracted nutrients before saving
            status: done
            priority: medium
            tests:
              - e2e: LLM UI flow (review page)
      - name: Error handling
        stories:
          - title: Gracefully handle missing API key
            status: done
            priority: low
            tests:
              - unit: OpenRouterLlmServiceTests.NoApiKey_ReturnsError
          - title: Gracefully handle fetch failure
            status: done
            priority: low
            tests:
              - unit: OpenRouterLlmServiceTests.FetchFailure_ReturnsError
          - title: Gracefully handle malformed response
            status: done
            priority: low
            tests:
              - unit: OpenRouterLlmServiceTests.MalformedResponse_ReturnsError

  - name: Application Shell
    tasks:
      - name: Navigation
        stories:
          - title: Home page loads with correct title
            status: done
            priority: high
            tests:
              - e2e: home title
          - title: Navigate to family page via link
            status: done
            priority: high
            tests:
              - e2e: home navigation
      - name: Error handling
        stories:
          - title: Show error page on unhandled exception
            status: done
            priority: high
